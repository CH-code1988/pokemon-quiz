<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포켓몬 퀴즈 모험</title>
<style>
/* 포켓몬 퀴즈 모험 — 1rem = 화면에 맞춰 자동으로 변하는 단위(PC·폰 가로 모두 같은 비율) */
:root {
  --ink: #2b2d42; --red: #ff5a5f; --yellow: #ffd23f; --green: #4fcf7a; --blue: #3d8bff; --pink: #ff8fb3;
  --shadow: 0 .7rem 0 rgba(43,45,66,.9);
}
html { font-size: min(1vw, 1.7vh); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe9ff; color: var(--ink); }
body {
  font-family: "Jua", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", system-ui, sans-serif; font-weight: 800; font-size: 2.6rem; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#app { position: fixed; inset: 0; overflow: hidden; }
.hidden { display: none !important; }
.jswarn { position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; background: #fff3b0; color: #2b2d42; border-top: 4px solid #2b2d42; padding: 14px 16px; font-size: 16px; line-height: 1.45; text-align: center; }
.errbox { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 100; background: #ffe0e0; border: 3px solid #c22; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4; color: #300; font-weight: 700; word-break: break-all; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.screen.active { display: flex; }
button { font-family: inherit; }

/* ---------- 버튼 ---------- */
.btn { white-space: nowrap; font: inherit; font-weight: 900; font-size: 3.2rem; line-height: 1.1; padding: 1.3rem 3rem; color: var(--ink); background: #fff; border: .5rem solid var(--ink); border-radius: 2.6rem; box-shadow: 0 .8rem 0 var(--ink); cursor: pointer; transition: transform .08s, box-shadow .08s; }
.btn:hover { background: #fffbe0; }
.btn:active { transform: translateY(.6rem); box-shadow: 0 .2rem 0 var(--ink); }
.btn.primary { background: var(--yellow); }
.btn.primary:hover { background: #ffe066; }
.btn.big { font-size: 4.2rem; padding: 1.4rem 3.6rem; }
.btn.small { font-size: 2.6rem; padding: .8rem 1.8rem; border-width: .4rem; border-radius: 2rem; box-shadow: 0 .5rem 0 var(--ink); min-height: max(44px, 5.6rem); min-width: 44px; }
.btn.small:active { transform: translateY(.4rem); box-shadow: 0 .1rem 0 var(--ink); }
.btn.snd.off { background: #e3e6ec; color: #7b8090; }
.row { display: flex; gap: 2rem; align-items: center; justify-content: center; }
.pill { background: rgba(255,255,255,.92); border: .4rem solid var(--ink); border-radius: 2rem; padding: .8rem 2rem; font-size: 2.6rem; min-height: max(44px, 5.6rem); display: flex; align-items: center; white-space: nowrap; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 2rem 3rem 1rem; flex: 0 0 auto; }
.topbar h2 { margin: 0; font-size: 4.4rem; text-shadow: 0 .3rem 0 #fff; }

/* ---------- 타이틀 ---------- */
#title { background: radial-gradient(circle at 50% 120%, #fff7c2 0, rgba(255,247,194,0) 55%), linear-gradient(#7fd4ff, #d5f4ff 70%, #c9f2b0); flex-direction: row; align-items: center; justify-content: center; gap: 5rem; padding-left: 3rem; padding-right: 3rem; }
#title:not(.active) { display: none; }
.title-left { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; position: relative; z-index: 2; }
.title-right { position: relative; z-index: 2; }
.logo { margin: 0; text-align: center; line-height: 1; font-size: 8.4rem; color: #ffd23f; -webkit-text-stroke: .9rem var(--ink); paint-order: stroke fill; text-shadow: 0 .9rem 0 var(--ink); transform: rotate(-3deg); letter-spacing: -.2rem; }
.logo span { display: block; }
.logo .l2 { font-size: 6.2rem; color: #fff; margin-top: .6rem; }
.title-mon { height: 12.5rem; width: auto; margin: -.6rem 0 -.4rem; filter: drop-shadow(0 1rem 0 rgba(0,0,0,.12)); animation: bob 1.6s ease-in-out infinite; pointer-events: none; }
.deco { position: absolute; font-size: 6rem; opacity: .9; animation: float 5s ease-in-out infinite; z-index: 1; }
.d1 { left: 6%; top: 12%; } .d2 { left: 44%; top: 8%; animation-delay: -1s; font-size: 4rem; } .d3 { left: 4%; bottom: 10%; font-size: 8rem; animation-delay: -2s; } .d4 { right: 6%; bottom: 8%; animation-delay: -3s; font-size: 5rem; }
@keyframes bob { 50% { transform: translateY(-1.4rem) rotate(2deg); } }
@keyframes float { 50% { transform: translateY(-1.6rem); } }

.stampcard { width: 46rem; background: #fffdf2; border: .6rem solid var(--ink); border-radius: 3rem; padding: 2rem 2.4rem; box-shadow: 0 1rem 0 var(--ink); }
.sc-head { display: flex; align-items: center; justify-content: space-between; font-size: 3rem; margin-bottom: 1.4rem; }
.sc-nav { font-size: 2.6rem; border: .4rem solid var(--ink); background: #fff; border-radius: 1.6rem; width: max(44px, 5.2rem); height: max(44px, 5.2rem); cursor: pointer; color: var(--ink); }
.sc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2rem; }
.slot { aspect-ratio: 1; border-radius: 50%; border: .4rem dashed #c8c0a8; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #c8c0a8; font-size: 2.4rem; }
.slot.on { border: .4rem solid #d9382f; color: #d9382f; background: #fff0ee; transform: rotate(-6deg); }
.slot.on:nth-child(even) { transform: rotate(5deg); }
.slot b { font-size: 4.4rem; line-height: 1; } .slot small { font-size: 1.9rem; line-height: 1; margin-top: .1rem; }
.sc-foot { text-align: center; margin-top: 1.4rem; font-size: 2.8rem; }

.stamp-pop { position: absolute; inset: 0; z-index: 10; background: rgba(43,45,66,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6rem; }
.stamp-big { width: 22rem; height: 22rem; border-radius: 50%; background: #fff0ee; border: 1rem solid #d9382f; color: #d9382f; display: flex; align-items: center; justify-content: center; font-size: 15rem; animation: stampIn .6s cubic-bezier(.2,1.6,.4,1) both; }
.stamp-msg { color: #fff; font-size: 6rem; text-shadow: 0 .5rem 0 var(--ink); } .stamp-sub { color: #fff; font-size: 3.2rem; text-shadow: 0 .3rem 0 var(--ink); }
@keyframes stampIn { 0% { transform: scale(3) rotate(-30deg); opacity: 0; } 70% { transform: scale(.92) rotate(-8deg); opacity: 1; } 100% { transform: scale(1) rotate(-8deg); } }

.sync-pop { position: absolute; inset: 0; z-index: 11; background: rgba(43,45,66,.6); display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.sync-card { background: #fffdf2; border: .6rem solid var(--ink); border-radius: 3rem; padding: 2rem 2.4rem; width: min(96rem, 100%); max-height: 100%; overflow-y: auto; box-shadow: 0 1rem 0 var(--ink); }
.sync-head { display: flex; justify-content: space-between; align-items: center; font-size: 3.6rem; margin-bottom: 1.2rem; }
.sync-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4rem; }
.sync-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.sync-t { font-size: 2.8rem; }
.sync-pop textarea { width: 100%; font: inherit; font-weight: 700; font-size: max(16px, 2.2rem); line-height: 1.3; border: .4rem solid var(--ink); border-radius: 1.6rem; padding: 1rem 1.2rem; background: #fff; color: var(--ink); resize: none; user-select: text; -webkit-user-select: text; word-break: break-all; }
.sync-h { font-size: 2.1rem; color: #5b6075; margin-top: .8rem; line-height: 1.35; }
.sync-msg { font-size: 2.4rem; line-height: 1.35; min-height: 3rem; } .sync-msg.ok { color: #0b7a39; } .sync-msg.bad { color: #c22; }

/* ---------- 지역 ---------- */
#regions { background: linear-gradient(#bfe9ff, #eaffd9); }
.region-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2.2rem; padding: 1rem 3rem 3.6rem; align-items: stretch; }
.rcard { border: .6rem solid var(--ink); border-radius: 3.4rem; box-shadow: 0 1rem 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; color: var(--ink); font: inherit; font-weight: 900; padding: 1rem .6rem; min-width: 0; transition: transform .1s; }
.rcard:hover { transform: translateY(-.6rem) rotate(-1deg); } .rcard:active { transform: translateY(.5rem); box-shadow: 0 .3rem 0 var(--ink); }
.rcard .re { font-size: 11rem; line-height: 1.1; filter: drop-shadow(0 .6rem 0 rgba(0,0,0,.15)); }
.rcard .rn { font-size: 6.6rem; color: #fff; -webkit-text-stroke: .7rem var(--ink); paint-order: stroke fill; line-height: 1; }
.rcard .rd { font-size: 1.9rem; white-space: nowrap; background: rgba(255,255,255,.8); border-radius: 1.6rem; padding: .4rem 1.2rem; text-align: center; }
.rcard .rp { font-size: 2.1rem; white-space: nowrap; background: #fff; border: .3rem solid var(--ink); border-radius: 1.6rem; padding: .3rem 1.2rem; margin-top: .6rem; }

/* ---------- 필드 ---------- */
#field { background: #8ee36b; align-items: center; justify-content: center; }
#field.active { display: flex; }
#fieldCanvas { display: block; touch-action: none; cursor: pointer; flex: 0 0 auto; }
.hud { position: absolute; top: calc(1.4rem + env(safe-area-inset-top)); display: flex; gap: 1.2rem; align-items: center; z-index: 3; }
.hud-left { left: calc(1.6rem + env(safe-area-inset-left)); } .hud-right { right: calc(1.6rem + env(safe-area-inset-right)); }
.field-hint { position: absolute; bottom: 2.6rem; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.94); border: .5rem solid var(--ink); border-radius: 3rem; padding: 1.2rem 3rem; font-size: 3.2rem; white-space: nowrap; animation: hint 1.4s ease-in-out infinite; pointer-events: none; transition: opacity .5s; z-index: 3; }
.field-hint.gone { opacity: 0; animation: none; }
@keyframes hint { 50% { transform: translateX(-50%) translateY(-.8rem); } }

/* ---------- 배틀 ---------- */
#battle { background: linear-gradient(#bfe9ff, #eaffd9); overflow: hidden; }
#battle.region-forest { background: linear-gradient(#bdeeff 0, #d9f7c8 55%, #8ee36b 100%); }
#battle.region-city { background: linear-gradient(#bfe3ff 0, #eaf5ff 55%, #cfd7e4 100%); }
#battle.region-desert { background: linear-gradient(#ffe2a0 0, #ffecc2 55%, #f3c97a 100%); }
#battle.region-sea { background: linear-gradient(#9fe5ff 0, #d6f6ff 55%, #ffe9a6 100%); }
#battle.gold { box-shadow: inset 0 0 0 1.2rem #ffd23f, inset 0 0 8rem rgba(255,210,63,.7); }
.b-top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 2rem 3rem .6rem; }
.hearts { display: flex; gap: .4rem; background: rgba(255,255,255,.9); border: .4rem solid var(--ink); border-radius: 2.4rem; padding: .2rem 1.6rem; min-width: 17rem; justify-content: center; }
.heart { font-size: 5.2rem; line-height: 1.15; color: #ff3b5c; text-shadow: 0 .3rem 0 rgba(0,0,0,.18); transition: transform .2s; }
.heart.empty { color: #cfd3dc; text-shadow: none; }
.heart.lose { animation: loseHeart .6s ease-out; }
@keyframes loseHeart { 0% { transform: scale(1.8); color: #ff3b5c; } 100% { transform: scale(1); } }
.chip { flex: 1; text-align: center; font-size: 3.2rem; background: rgba(255,255,255,.9); border: .4rem solid var(--ink); border-radius: 2.4rem; padding: .7rem 2rem; max-width: 70rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#battle.gold .chip { background: #fff3b0; }
.b-main { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 34% 1fr; gap: 2.6rem; padding: .6rem 3rem 2.4rem; }
.b-stage { display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 0; }
.spot { flex: 1 1 0; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
.spot::before { content: ""; position: absolute; left: 8%; right: 8%; bottom: 6%; height: 16%; background: radial-gradient(ellipse, rgba(0,0,0,.22), rgba(0,0,0,0) 70%); }
#bImg { position: relative; max-width: 100%; max-height: 100%; height: 100%; width: auto; object-fit: contain; transition: filter .7s; filter: drop-shadow(0 .6rem 0 rgba(0,0,0,.1)); }
#bImg.sil { filter: brightness(0) drop-shadow(0 .4rem 0 rgba(0,0,0,.15)); }
#bImg.revealed { animation: reveal .8s ease-out; }
#bImg.enter { animation: enter .6s cubic-bezier(.2,1.4,.4,1); }
@keyframes enter { 0% { transform: translateX(40%) scale(.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes reveal { 0% { transform: scale(.8); } 50% { transform: scale(1.12) rotate(-3deg); } 100% { transform: scale(1); } }
.fallback { position: absolute; font-size: 14rem; color: #2b2d42; }
.b-name { flex: 0 0 auto; min-height: 5.6rem; font-size: 4.6rem; color: #fff; -webkit-text-stroke: .6rem var(--ink); paint-order: stroke fill; text-align: center; line-height: 1.15; opacity: 0; transform: scale(.6); transition: .3s; }
.b-name.show { opacity: 1; transform: none; }
.b-types { flex: 0 0 auto; min-height: 4.4rem; display: flex; gap: 1rem; justify-content: center; opacity: 0; transition: opacity .3s; }
.b-types.show { opacity: 1; }
.tchip { font-size: 2.4rem; color: #fff; padding: .3rem 1.4rem; border-radius: 2rem; border: .3rem solid var(--ink); text-shadow: 0 .15rem 0 rgba(0,0,0,.3); line-height: 1.25; }
.t-normal{background:#a8a77a}.t-fire{background:#f5833a}.t-water{background:#5b8cf5}.t-electric{background:#f6c61c;color:#5a4500;text-shadow:none}.t-grass{background:#5bc24d}.t-ice{background:#7fd6e0;color:#12505a;text-shadow:none}.t-fighting{background:#c22e28}.t-poison{background:#a33ea1}.t-ground{background:#d9b150;color:#503c00;text-shadow:none}.t-flying{background:#9aa8f5}.t-psychic{background:#f95587}.t-bug{background:#a6b91a}.t-rock{background:#b6a136}.t-ghost{background:#735797}.t-dragon{background:#6f35fc}.t-dark{background:#705746}.t-steel{background:#8c8ca8}.t-fairy{background:#ee90ac}
.b-panel { display: flex; flex-direction: column; gap: 1.8rem; min-height: 0; min-width: 0; }
.bubble { position: relative; flex: 1 1 0; min-height: 0; background: #fff; border: .5rem solid var(--ink); border-radius: 3rem; padding: 1.2rem 2.4rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; text-align: center; box-shadow: 0 .8rem 0 rgba(43,45,66,.85); overflow: hidden; }
.bubble::before { content: ""; position: absolute; left: -2.4rem; top: 38%; width: 3.6rem; height: 3.6rem; background: #fff; border-left: .5rem solid var(--ink); border-bottom: .5rem solid var(--ink); transform: rotate(45deg); }
.bubble.pop { animation: pop .35s ease-out; } .bubble.shake { animation: shake .4s; }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes shake { 20% { transform: translateX(-1.2rem); } 40% { transform: translateX(1.2rem); } 60% { transform: translateX(-.8rem); } 80% { transform: translateX(.8rem); } }
.b-q { font-size: 3.3rem; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
.b-big { font-size: 8rem; line-height: 1.15; max-width: 100%; letter-spacing: .1rem; word-break: keep-all; }
.b-big.none { display: none; } .b-big.word { font-size: 6rem; }
.choices { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; }
.choice { position: relative; font: inherit; font-weight: 900; font-size: 4rem; min-height: 11.6rem; padding: .6rem 1.2rem .6rem 4.6rem; color: var(--ink); background: #fff; border: .5rem solid var(--ink); border-radius: 2.8rem; box-shadow: 0 .9rem 0 var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15; transition: transform .08s, box-shadow .08s, background .15s; overflow: hidden; }
.choice span { overflow-wrap: anywhere; word-break: keep-all; }
.choice.mid { font-size: 3.5rem; } .choice.long { font-size: 2.9rem; }
.choice:hover:not(:disabled) { background: #fff7c8; }
.choice:active:not(:disabled) { transform: translateY(.7rem); box-shadow: 0 .2rem 0 var(--ink); }
.choice .kbd { display: none; position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 2.6rem; width: 3.4rem; height: 3.4rem; line-height: 3rem; border-radius: .9rem; background: #eef0f6; border: .3rem solid #b7bccd; color: #7b8197; text-align: center; }
@media (hover: hover) and (pointer: fine) { .choice .kbd { display: block; } }
@media (hover: none), (pointer: coarse) { .choice { padding-left: 1.2rem; } }
.choice.no, .choice:disabled.no { background: #d6d9e0; color: #9096a5; border-color: #8a90a0; box-shadow: 0 .2rem 0 #8a90a0; transform: translateY(.7rem); cursor: not-allowed; text-decoration: line-through; }
.choice.ok { background: #7ee2a0; animation: pop .4s; }
.choice.ok::after { content: "✔"; position: absolute; right: 1.2rem; top: .5rem; font-size: 3rem; color: #0b7a39; }
.choices.done .choice:not(.ok) { pointer-events: none; opacity: .55; }
#battle.catching .b-panel { visibility: hidden; }
.bfx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.throw-ball { position: absolute; width: 8rem; height: 8rem; border-radius: 50%; border: .5rem solid var(--ink); background: linear-gradient(#ff4d4f 0 46%, var(--ink) 46% 54%, #fff 54%); box-shadow: inset -.8rem -.8rem 0 rgba(0,0,0,.08); }
.throw-ball::after { content: ""; position: absolute; left: 50%; top: 50%; width: 2.8rem; height: 2.8rem; margin: -1.4rem; border-radius: 50%; background: #fff; border: .5rem solid var(--ink); }
.throw-ball.gold { background: linear-gradient(#ffc61a 0 46%, var(--ink) 46% 54%, #fff1b0 54%); box-shadow: 0 0 3rem 1rem rgba(255,220,60,.8); }
.spark { position: absolute; font-size: 4rem; color: #ffc61a; text-shadow: 0 .2rem 0 var(--ink); }
.b-overlay { position: absolute; inset: 0; z-index: 8; background: rgba(255,255,255,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; text-align: center; padding: 2rem 6rem; animation: fade .3s; }
@keyframes fade { from { opacity: 0; } }
.ov-msg { font-size: 8rem; line-height: 1.15; color: #ff5a5f; -webkit-text-stroke: .8rem var(--ink); paint-order: stroke fill; }
.ov-sub { font-size: 3.8rem; line-height: 1.4; } .ov-sub b { font-size: 4.6rem; }
.newtag { display: inline-block; background: #ff5a5f; color: #fff; border: .3rem solid var(--ink); border-radius: 1.2rem; padding: 0 1.2rem; font-size: 3rem; transform: rotate(-6deg); vertical-align: middle; }

/* ---------- 도감 ---------- */
#dex { background: linear-gradient(#ffe9f1, #e4f3ff); }
.seg { display: flex; gap: 1.2rem; }
.seg .btn.on { background: var(--yellow); }
.dex-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 1.6rem; padding: 1rem 3rem 3rem; align-content: start; -webkit-overflow-scrolling: touch; }
.dcell { background: #fff; border: .4rem solid var(--ink); border-radius: 2.4rem; padding: .8rem .6rem 1rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; box-shadow: 0 .5rem 0 rgba(43,45,66,.8); min-width: 0; }
.dcell.got { background: #fffdf0; } .dcell.rare.got { background: linear-gradient(#fff6c0, #fffdf0); border-color: #c98a00; }
.dcell img { width: 12rem; height: 12rem; object-fit: contain; } .dcell img.sil { filter: brightness(0); opacity: .75; }
.dnum { font-size: 2rem; color: #7b8197; } .dname { font-size: 2.6rem; text-align: center; line-height: 1.15; word-break: keep-all; }
.dtypes { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; min-height: 3.2rem; } .dtypes .tchip { font-size: 1.8rem; padding: .1rem .8rem; border-width: .25rem; }
.dempty { grid-column: 1 / -1; text-align: center; font-size: 4rem; padding: 10rem 2rem; line-height: 1.5; }

/* ---------- 전환 효과 ---------- */
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: 0; background: radial-gradient(circle, #fff 0, #fff 40%, #fff6b8 100%); }
.flash.on { animation: flash 1.05s ease-in-out; }
@keyframes flash { 0% { opacity: 0; transform: scale(.6); } 45% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(1.8); } }
@media (prefers-reduced-motion: reduce) { .title-mon, .deco, .field-hint { animation: none; } }

/* ---------- 세로 화면(폰·태블릿 세로): 폭 약 55rem 기준으로 다시 배치 ---------- */
@media (orientation: portrait) {
  html { font-size: min(1.8vw, 1.05vh); }
  .sync-cols { grid-template-columns: 1fr; } .sync-card { padding: 1.6rem; }
  .topbar { flex-wrap: wrap; justify-content: center; padding: 1.6rem 2rem .8rem; gap: 1rem; }
  .topbar h2 { font-size: 4rem; order: -1; width: 100%; text-align: center; }
  #title { flex-direction: column; gap: 2rem; justify-content: center; padding: 3rem 2rem; overflow: hidden; }

  .stampcard { width: min(50rem, 94vw); } .d3 { bottom: 3%; }

    _state: function () { return S; },
    _show: function (q) { S.phase = 'q'; S.locked = false; $('#bChoices').classList.remove('done'); render(q); },
    _answerCorrect: function () { if (!S) return; var q = S.cur, i = q.choices.indexOf(q.a); choose(i); },
    key: function (e) {
      if (!S) return false;
      if (!$('#bOverlay').classList.contains('hidden')) { if (e.key === 'Enter' || e.key === ' ') { $('#ovBtn').click(); return true; } return false; }
      if (e.key >= '1' && e.key <= '4') { choose(+e.key - 1); return true; }
      return false;
    },
    init: function () { $('#bSpeak').addEventListener('click', function () { root.Sfx.unlock(); if (S && S.cur && S.phase !== 'end') root.Voice.read(S.cur); });
      $('#ovBtn').addEventListener('click', function () { if (S) { root.Sfx.click(); finish(S.over || 'fled'); } }); }
  };
  root.Battle = Battle;
})(window);

</script>
<script>
// 도감: 전체 포켓몬을 칸으로. 잡은 건 그림·이름, 못 잡은 건 실루엣·???
(function (root) {
  'use strict';
  var filter = 'all';
  function pad3(n) { return n < 10 ? '00' + n : n < 100 ? '0' + n : '' + n; }
  function render() {
    var P = root.POKEMON, S = root.Store, grid = document.getElementById('dexGrid'), n = 0, art = filter === 'art';
    grid.innerHTML = ''; grid.classList.toggle('art', art);
    P.forEach(function (p) {
      var got = S.isCaught(p.id); if (got) n++;
      if (filter === 'caught' && !got) return;
      var show = got || art;   // 그림 모두 보기: 못 잡은 포켓몬도 색칠된 그림·이름으로 보여 줌
      var c = document.createElement('div'); c.className = 'dcell' + (show ? ' got' : '') + (art && got ? ' mine' : '') + (p.rank !== 'normal' ? ' rare' : '');
      var img = document.createElement('img'); img.loading = 'lazy'; img.alt = show ? p.name : '';
      if (!show) img.className = 'sil'; root.PokeImg.attach(img, p.id);
      var num = document.createElement('div'); num.className = 'dnum'; num.textContent = '#' + pad3(p.id) + (p.rank !== 'normal' ? ' ★' : '');
      var nm = document.createElement('div'); nm.className = 'dname'; nm.textContent = show ? p.name : '???';
      var ty = document.createElement('div'); ty.className = 'dtypes'; ty.innerHTML = show ? root.typeChips(p.types) : '';
      if (show) { c.classList.add('tap'); c.addEventListener('click', function () { root.Sfx.unlock(); if (root.Voice) root.Voice.say(p.name); }); }   // 눌러서 이름 듣기
      c.appendChild(num); c.appendChild(img); c.appendChild(nm); c.appendChild(ty); grid.appendChild(c);
    });
    if (!grid.children.length) { grid.innerHTML = '<div class="dempty">아직 잡은 포켓몬이 없어요.<br>필드에서 몬스터볼을 찾아봐요!</div>'; }
    document.getElementById('dexCount').textContent = n + ' / ' + P.length;
    document.querySelectorAll('#dex [data-filter]').forEach(function (b) { b.classList.toggle('on', b.dataset.filter === filter); });
  }
  root.Dex = {
    show: function () { if (root.Voice) root.Voice.stop(); render(); document.getElementById('dexGrid').scrollTop = 0; },
    setFilter: function (f) { filter = f; render(); },
    init: function () {
      document.querySelectorAll('#dex [data-filter]').forEach(function (b) { b.addEventListener('click', function () { root.Sfx.click(); root.Dex.setFilter(b.dataset.filter); }); });
      var back = document.getElementById('dexBack'); if (back) back.addEventListener('click', function () { if (root.Voice) root.Voice.stop(); });
    }
  };
})(window);

</script>
<script>
// 화면 전환, 타이틀(출석 도장), 지역 고르기, 배틀 시작 연결
(function (root) {
  'use strict';
  var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var current = 'title', prevScreen = 'title', region = null, recent = [], stampPage = 0, busy = false;

  function show(name) {
    if (name !== current) prevScreen = current;
    current = name;
    $$('.screen').forEach(function (s) { s.classList.toggle('active', s.id === name); });
    if (name === 'field') { root.Field.resize(); }
    if (name !== 'field' && name !== 'battle') root.Field.stop();
    if (name === 'title') renderStamps(true);
    if (name === 'regions') renderRegions();
    if (name === 'dex') root.Dex.show();
  }

  // ---- 소리 버튼 ----
  function syncSound() {
    $$('[data-snd]').forEach(function (b) { var on = root.Sfx.on; b.classList.toggle('off', !on); b.textContent = (on ? '🔊' : '🔇') + (b.classList.contains('small') && b.closest('.hud, .topbar, .b-top') ? '' : (on ? ' 소리 켜짐' : ' 소리 꺼짐')); b.setAttribute('aria-label', on ? '소리 끄기' : '소리 켜기'); });
  }
  function toggleSound() { root.Sfx.on = !root.Sfx.on; root.Store.setSound(root.Sfx.on); syncSound(); if (root.Sfx.on) { root.Sfx.unlock(); root.Sfx.click(); } }

  // ---- 출석 도장 ----
  function renderStamps(latest) {
    var st = root.Store.data.stamps, per = 10, pages = Math.max(1, Math.ceil(st.length / per));
    if (latest) stampPage = pages - 1; stampPage = Math.max(0, Math.min(pages - 1, stampPage));
    var g = $('#scGrid'); g.innerHTML = '';
    for (var i = 0; i < per; i++) {
      var idx = stampPage * per + i, d = st[idx], c = document.createElement('div'); c.className = 'slot' + (d ? ' on' : '');
      c.innerHTML = d ? '<b>★</b><small>' + (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)) + '</small>' : '<span>' + (idx + 1) + '</span>';
      g.appendChild(c);
    }
    $('#scTitle').textContent = '출석 도장 카드 ' + (stampPage + 1) + (pages > 1 ? ' / ' + pages : '');
    $('#scFoot').textContent = st.length ? '지금까지 도장 ' + st.length + '개!' : '오늘 처음이에요!';
    $('#scPrev').style.visibility = stampPage > 0 ? 'visible' : 'hidden'; $('#scNext').style.visibility = stampPage < pages - 1 ? 'visible' : 'hidden';
  }
  function checkStamp() {
    if (!root.Store.addStampToday()) return;
    var n = root.Store.data.stamps.length; renderStamps(true);
    $('#stampSub').textContent = '도장 ' + n + '개째! 내일도 놀러 와요.';
    $('#stampPop').classList.remove('hidden');
    setTimeout(function () { root.Sfx.stamp(); }, 250);
  }

  // ---- 지역 ----
  function renderRegions() {
    var g = $('#regionGrid'); g.innerHTML = '';
    root.Regions.list.forEach(function (r) {
      var all = r.normal.concat(r.gold.filter(function (p) { return r.normal.indexOf(p) < 0; })), got = all.filter(function (p) { return root.Store.isCaught(p.id); }).length;
      var b = document.createElement('button'); b.className = 'rcard r-' + r.key; b.style.background = 'linear-gradient(160deg,' + r.card[0] + ',' + r.card[1] + ')';
      b.innerHTML = '<span class="re">' + r.emoji + '</span><span class="rn">' + r.name + '</span><span class="rd">' + r.desc + '</span><span class="rp">잡은 포켓몬 ' + got + ' / ' + all.length + '</span>';
      b.addEventListener('click', function () { root.Sfx.click(); enterField(r.key); });
      g.appendChild(b);
    });
  }
  function enterField(key) {
    region = root.Regions.byKey[key]; recent = [];
    $('#fRegion').textContent = region.emoji + ' ' + region.name; updateCount();
    show('field'); root.Field.enter(key);
  }
  function updateCount() { $('#fCount').textContent = '도감 ' + root.Store.caughtCount() + ' / ' + root.POKEMON.length; }

  // ---- 포켓몬 고르기: 안 잡은 포켓몬이 더 자주 나오게 ----
  function choosePokemon(gold) {
    var pool = (gold ? region.gold : region.normal).filter(function (p) { return recent.indexOf(p.id) < 0; });
    if (!pool.length) pool = gold ? region.gold : region.normal;
    var w = pool.map(function (p) { return root.Store.isCaught(p.id) ? 1 : 3; }), sum = w.reduce(function (a, b) { return a + b; }, 0), r = Math.random() * sum, i = 0;
    while (i < pool.length - 1 && r >= w[i]) { r -= w[i]; i++; }
    var p = pool[i]; recent.push(p.id); if (recent.length > 8) recent.shift(); return p;
  }

  // ---- 몬스터볼에 닿음 → 배틀 ----
  function onBallHit(ball) {
    if (busy) return; busy = true;
    var poke = choosePokemon(ball.gold);
    root.Sfx.start(); var f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    setTimeout(function () {
      show('battle'); root.Battle.start(poke, ball.gold, region.key, function () {
        show('field'); updateCount(); root.Field.resume(); busy = false;
      });
    }, 520);
    setTimeout(function () { f.classList.remove('on'); }, 1100);
  }

  function init() {
    var w = $('#jsWarn'); if (w) w.style.display = 'none';
    window.addEventListener('error', function (e) { var b = $('#errBox'); if (!b) return; b.textContent = '문제가 생겼어요(캡처해서 알려 주세요): ' + (e.message || '') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || ''); b.classList.remove('hidden'); b.onclick = function () { b.classList.add('hidden'); }; });
    root.Sfx.on = root.Store.data.sound; syncSound();
    root.Field.init(onBallHit); root.Battle.init(); root.Dex.init();
    $$('[data-snd]').forEach(function (b) { b.addEventListener('click', toggleSound); });
    $$('[data-go]').forEach(function (b) { b.addEventListener('click', function () { root.Sfx.click(); show(b.dataset.go); }); });
    $('#btnStart').addEventListener('click', function () { root.Sfx.click(); show('regions'); });
    $('#btnTitleDex').addEventListener('click', function () { root.Sfx.click(); show('dex'); });
    $('#fHome').addEventListener('click', function () { root.Sfx.click(); show('regions'); });
    $('#fDex').addEventListener('click', function () { root.Sfx.click(); show('dex'); });
    $('#dexBack').addEventListener('click', function () { root.Sfx.click(); var back = prevScreen === 'field' && region ? 'field' : (prevScreen === 'regions' ? 'regions' : 'title'); show(back); if (back === 'field') root.Field.resume(); });
    // 기록 옮기기
    function syncMsg(t, ok) { var m = $('#syncMsg'); m.textContent = t; m.className = 'sync-msg ' + (ok ? 'ok' : 'bad'); }
    $('#btnSync').addEventListener('click', function () { root.Sfx.click(); $('#syncOut').value = root.Store.exportCode(); $('#syncIn').value = ''; syncMsg('', true); $('#syncShare').style.display = navigator.share ? '' : 'none'; $('#syncPop').classList.remove('hidden'); });
    $('#syncClose').addEventListener('click', function () { root.Sfx.click(); $('#syncPop').classList.add('hidden'); });
    $('#syncOut').addEventListener('focus', function () { this.select(); });
    $('#syncCopy').addEventListener('click', function () {
      var ta = $('#syncOut'), done = function () { root.Sfx.correct(); $('#syncCopy').textContent = '✔ 복사됐어요'; setTimeout(function () { $('#syncCopy').textContent = '📋 코드 복사'; }, 1800); };
      ta.focus(); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy') && done(); } catch (e) {} });
      else { try { document.execCommand('copy') && done(); } catch (e) {} }
    });
    $('#syncShare').addEventListener('click', function () { try { navigator.share({ title: '포켓몬 퀴즈 기록', text: $('#syncOut').value }); } catch (e) {} });
    $('#syncGo').addEventListener('click', function () {
      var r = root.Store.importCode($('#syncIn').value);
      if (!r.ok) { root.Sfx.wrong(); syncMsg(r.error, false); return; }
      root.Sfx.caught(); renderStamps(true); $('#syncOut').value = root.Store.exportCode();
      syncMsg('합쳤어요! 새 포켓몬 ' + r.newCaught + '마리, 새 도장 ' + r.newStamps + '개 · 지금 도감 ' + r.totalCaught + ' / ' + root.POKEMON.length + ', 도장 ' + r.totalStamps + '개', true); $('#syncIn').value = '';
    });
    $('#scPrev').addEventListener('click', function () { stampPage--; renderStamps(); root.Sfx.click(); });
    $('#scNext').addEventListener('click', function () { stampPage++; renderStamps(); root.Sfx.click(); });
    $('#stampOk').addEventListener('click', function () { root.Sfx.click(); $('#stampPop').classList.add('hidden'); });
    // 소리는 첫 터치·키 입력 뒤에만 켜진다 (브라우저 규칙)
    ['touchstart', 'touchend', 'pointerup', 'mousedown', 'click', 'keydown'].forEach(function (ev) { window.addEventListener(ev, function () { root.Sfx.unlock(); }, { capture: true, passive: true }); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { if (root.Voice) root.Voice.stop(); } });
    window.addEventListener('keydown', function (e) {
      if (e.target && e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') $('#syncClose').click(); return; }
      if (current === 'battle') { if (root.Battle.key(e)) e.preventDefault(); return; }
      if (e.key === 'Enter' || e.key === ' ') { if (!$('#stampPop').classList.contains('hidden')) { $('#stampOk').click(); e.preventDefault(); } else if (current === 'title' && document.activeElement === document.body) { $('#btnStart').click(); e.preventDefault(); } }
      if (e.key === 'Escape' && !$('#syncPop').classList.contains('hidden')) { $('#syncClose').click(); return; }
      if (e.key === 'Escape') { if (current === 'dex') $('#dexBack').click(); else if (current === 'field') $('#fHome').click(); else if (current === 'regions') show('title'); }
    });
    document.addEventListener('contextmenu', function (e) { if (e.target.closest('#field')) e.preventDefault(); });
    renderStamps(true); checkStamp();
  }
  root.Game = { show: show, enterField: enterField, _region: function () { return region; } };
  document.addEventListener('DOMContentLoaded', init);
})(window);

</script>
